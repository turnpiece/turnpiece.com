name: Dependabot auto-merge

# Runs on each Dependabot PR, plus a weekly sweep (and a manual button) that
# picks up any Dependabot PRs still open, e.g. ones opened before this existed.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One run per PR (plus one for the sweep). A single shared group would let
# GitHub keep only one queued run and cancel the rest. Runs can overlap, but
# --match-head-commit and GitHub's own mergeability check keep merges safe.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name != 'pull_request' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Merge Dependabot PR(s)
        run: |
          # Keep the script from the triggering ref, since checkouts below move HEAD.
          cp .github/scripts/merge-dependabot-pr.sh "$RUNNER_TEMP/merge.sh"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            prs="${{ github.event.pull_request.number }}"
          else
            prs=$(gh pr list --author app/dependabot --state open --json number --jq '.[].number' | sort -n)
          fi
          failed=0
          for pr in $prs; do
            echo "::group::PR #$pr"
            bash "$RUNNER_TEMP/merge.sh" "$pr" || { echo "::error::PR #$pr failed"; failed=1; }
            git checkout --quiet --force "$GITHUB_SHA"
            echo "::endgroup::"
          done
          exit $failed
