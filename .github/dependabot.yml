# Version updates go to develop, grouped to keep PR noise low. Security
# updates ignore target-branch and open against the default branch, which is
# also develop. If one targets main anyway, dependabot-auto-merge moves it.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /theme
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
